<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Print Success Animation Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      color: white;
    }
    .hint { font-size: 0.9rem; color: #94a3b8; }
    button.replay {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white; border: none;
      padding: 10px 28px; border-radius: 8px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(59,130,246,0.45);
      transition: transform 0.1s;
    }
    button.replay:active { transform: scale(0.96); }

    .overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45);
      animation: fpFadeIn 0.25s ease both;
    }
    .card {
      background: white; border-radius: 24px;
      padding: 44px 64px;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      animation: fpScaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
      position: relative;
    }
    .ring { position: absolute; width: 120px; height: 120px; border-radius: 50%; pointer-events: none; }
    .ring1 { border: 4px solid #22c55e; animation: fpRing1 1.3s ease-out 0.25s both; }
    .ring2 { border: 3px solid #86efac; animation: fpRing2 1.5s ease-out 0.35s both; }
    .ring3 { border: 2px solid #bbf7d0; animation: fpRing2 1.7s ease-out 0.45s both; }
    .circle {
      width: 82px; height: 82px; border-radius: 50%;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 28px rgba(34,197,94,0.55);
      position: relative; z-index: 1;
    }
    .check-path { stroke-dasharray: 80; stroke-dashoffset: 80; animation: fpCheckDraw 0.45s ease 0.3s forwards; }
    .label-big { font-size: 1.35rem; font-weight: 800; color: #0f172a; letter-spacing: -0.3px; }
    .label-sub { font-size: 0.88rem; color: #64748b; margin-top: 4px; }

    @keyframes fpFadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fpScaleIn { from { transform: scale(0.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @keyframes fpCheckDraw { to { stroke-dashoffset: 0 } }
    @keyframes fpRing1 { 0% { transform: scale(0.65); opacity: 1 } 100% { transform: scale(2.4); opacity: 0 } }
    @keyframes fpRing2 { 0% { transform: scale(0.65); opacity: 0.8 } 100% { transform: scale(3.0); opacity: 0 } }
  </style>
</head>
<body>
  <p class="hint">Animation auto-plays on load &mdash; click to replay</p>
  <button class="replay" onclick="showAnim()">&#9654; Play Animation</button>

  <script>
    function showAnim() {
      const old = document.getElementById('anim-overlay');
      if (old) old.remove();

      const overlay = document.createElement('div');
      overlay.id = 'anim-overlay';
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="card">
          <div class="ring ring1"></div>
          <div class="ring ring2"></div>
          <div class="ring ring3"></div>
          <div class="circle">
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
              <path class="check-path" d="M11 23L19 31L33 14"
                stroke="white" stroke-width="4.5"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div style="text-align:center">
            <div class="label-big">Printed Successfully!</div>
            <div class="label-sub">Barcodes sent to printer &#10003;</div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      playSuccessChime();

      setTimeout(() => {
        overlay.style.transition = 'opacity 0.3s';
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 300);
      }, 1800);
    }

    function playSuccessChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
          gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
          gain.gain.linearRampToValueAtTime(0.28, ctx.currentTime + i * 0.12 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.45);
          osc.start(ctx.currentTime + i * 0.12);
          osc.stop(ctx.currentTime + i * 0.12 + 0.5);
        });
        setTimeout(() => ctx.close(), 2000);
      } catch(e) {}
    }

    window.onload = () => setTimeout(showAnim, 300);
  </script>
</body>
</html>
